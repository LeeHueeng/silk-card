<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk — card suite demo</title>
<style>
  :root {
    --primary-color: #4aa8ff;
    --rgb-primary-color: 74, 168, 255;
    --primary-text-color: #e1e5ea;
    --rgb-primary-text-color: 225, 229, 234;
    --secondary-text-color: #9aa4b2;
    --card-background-color: #1c1f26;
    --secondary-background-color: #14161c;
    --disabled-text-color: #6f6f6f;
    --error-color: #ef6c6c;
    --page-bg: #12141a;
  }
  :root[data-theme="light"] {
    --primary-color: #1f7ae0;
    --rgb-primary-color: 31, 122, 224;
    --primary-text-color: #1c2430;
    --rgb-primary-text-color: 28, 36, 48;
    --secondary-text-color: #5d6b7c;
    --card-background-color: #ffffff;
    --secondary-background-color: #eef1f5;
    --disabled-text-color: #b0b6bf;
    --page-bg: #e9edf2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    color: var(--primary-text-color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 32px 20px 80px;
  }
  header { max-width: 1180px; margin: 0 auto 8px; display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header p { color: var(--secondary-text-color); font-size: 13px; margin: 0; flex: 1; }
  #theme {
    border: none; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    color: var(--secondary-text-color);
    background: rgba(var(--rgb-primary-text-color), 0.08);
  }
  h2 {
    max-width: 1180px; margin: 34px auto 12px; font-size: 13px; font-weight: 600;
    color: var(--secondary-text-color); letter-spacing: 0.01em;
  }
  h2 span { color: var(--primary-text-color); }
  .grid {
    max-width: 1180px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px;
  }
  .slot { height: 68px; }
  .slot.h2x { height: 150px; }
  .slot.h3x { height: 205px; }
  .slot.h4x { height: 270px; }
  .slot.sq { height: 150px; }
</style>
</head>
<body>
<header>
  <h1>Silk</h1>
  <p>Every card is live — click, drag, toggle. Mock data only.</p>
  <button id="theme">Light mode</button>
</header>
<main id="main"></main>

<script type="module">
import '../dist/silk-card.js';

/* ---------- minimal HA element stand-ins ---------- */

import { MDI_PATHS } from './icons.js';

const DOMAIN_ICONS = {
  light: 'mdi:lightbulb', switch: 'mdi:power-socket-eu', input_boolean: 'mdi:toggle-switch',
  fan: 'mdi:fan', cover: 'mdi:blinds-horizontal', climate: 'mdi:thermostat',
  media_player: 'mdi:speaker', lock: 'mdi:lock', scene: 'mdi:palette',
  script: 'mdi:script-text', button: 'mdi:gesture-tap-button', input_button: 'mdi:gesture-tap-button',

  temperature: 'mdi:thermometer', humidity: 'mdi:water-percent', power: 'mdi:flash',
  battery: 'mdi:battery-70', carbon_dioxide: 'mdi:molecule-co2', energy: 'mdi:lightning-bolt',

function iconFor(stateObj) {
  if (!stateObj) return 'mdi:help-circle-outline';
  if (stateObj.attributes.icon) return stateObj.attributes.icon;
  const cls = stateObj.attributes.device_class;
  if (cls && CLASS_ICONS[cls]) return CLASS_ICONS[cls];
  return DOMAIN_ICONS[stateObj.entity_id.split('.')[0]] ?? 'mdi:eye';
}

class MdiBase extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  renderIcon(icon) {
    const d = MDI_PATHS[icon] ?? MDI_PATHS['mdi:eye'];
    this.shadowRoot.innerHTML =
      '<style>:host{display:block;line-height:0}svg{width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor;display:block}</style>' +
      `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  }
}
if (!customElements.get('ha-icon')) {
  customElements.define('ha-icon', class extends MdiBase {
    set icon(v) { this._i = v; this.renderIcon(v); }
    get icon() { return this._i; }
    connectedCallback() { if (!this.shadowRoot.innerHTML) this.renderIcon(this.getAttribute('icon') ?? this._i); }
  });
}
if (!customElements.get('ha-state-icon')) {
  customElements.define('ha-state-icon', class extends MdiBase {
    set hass(_) {}
    set stateObj(v) { this._s = v; this.renderIcon(iconFor(v)); }
    connectedCallback() { if (!this.shadowRoot.innerHTML) this.renderIcon(iconFor(this._s)); }
  });
}
if (!customElements.get('ha-card')) {
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      this.style.cssText +=
        ';background:var(--card-background-color);border-radius:16px;' +
        'box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.10);';
    }
  });
}

/* ---------- mock data ---------- */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SENSORS = {
  'sensor.living_temp':   { base: 22, amp: 3, noise: 0.12, unit: '°C', name: 'Living room', device_class: 'temperature', seed: 11 },
  'sensor.bedroom_temp':  { base: 20, amp: 2, noise: 0.1, unit: '°C', name: 'Bedroom', device_class: 'temperature', seed: 22 },
  'sensor.office_temp':   { base: 23, amp: 2.4, noise: 0.1, unit: '°C', name: 'Office', device_class: 'temperature', seed: 55 },
  'sensor.humidity':      { base: 55, amp: 14, noise: 0.9, unit: '%', name: 'Bathroom humidity', device_class: 'humidity', seed: 44 },
  'sensor.house_power':   { base: 640, amp: 320, noise: 60, unit: 'W', name: 'House power', device_class: 'power', seed: 33, spiky: true },
  'sensor.solar':         { base: 820, amp: 800, noise: 40, unit: 'W', name: 'Solar', device_class: 'power', seed: 77 },
  'sensor.co2':           { base: 620, amp: 180, noise: 22, unit: 'ppm', name: 'CO₂', device_class: 'carbon_dioxide', seed: 66 },
  'sensor.phone_battery': { base: 74, amp: 22, noise: 0.4, unit: '%', name: 'Phone battery', device_class: 'battery', seed: 88 },
  'sensor.cpu':           { base: 34, amp: 22, noise: 6, unit: '%', name: 'Server CPU', seed: 99, icon: 'mdi:cpu-64-bit' },
  'sensor.disk':          { base: 61, amp: 2, noise: 0.2, unit: '%', name: 'NVMe used', seed: 12, icon: 'mdi:harddisk' },
  'sensor.net_down':      { base: 42, amp: 30, noise: 12, unit: 'KiB/s', name: 'Download', seed: 71, spiky: true },
  'sensor.net_up':        { base: 14, amp: 8, noise: 4, unit: 'KiB/s', name: 'Upload', seed: 72 },
  'sensor.outdoor_temp':  { base: 29, amp: 5, noise: 0.2, unit: '°C', name: 'Outdoor', device_class: 'temperature', seed: 73 },
};

function valueAt(id, t) {
  const s = SENSORS[id];
  const rng = mulberry32(s.seed + Math.floor(t / 1200));
  const day = Math.sin(((t % 86400) / 86400) * Math.PI * 2 - Math.PI / 2);
  const slow = Math.sin(t / 41000 + s.seed) * s.amp * 0.35;
  let v = s.base + day * s.amp + slow + (rng() - 0.5) * 2 * s.noise;
  if (s.spiky && rng() > 0.86) v += s.amp * (0.8 + rng());
  return v;
}

    const el = document.createElement(customElements.get(tag) ? tag : 'div');
    if (el.setConfig) {
      try { el.setConfig(config); } catch (e) { el.textContent = String(e.message); }
    } else {
      el.textContent = `(${config.type})`;
      el.style.cssText = 'padding:10px;font-size:12px;color:var(--secondary-text-color)';
    }
    return el;
  },
});

function dailyForecast() {
  const conds = ['sunny', 'partlycloudy', 'rainy', 'cloudy', 'partlycloudy', 'sunny', 'rainy'];
  const base = new Date().setHours(9, 0, 0, 0);
  return conds.map((condition, i) => ({
    datetime: new Date(base + i * 86400_000).toISOString(),
    condition,
    temperature: 28 + ((i * 7) % 5) - 2,
    templow: 20 + ((i * 3) % 4),
    precipitation_probability: [0, 10, 70, 30, 10, 0, 60][i],
  }));
}

function hourlyForecast() {
  const conds = ['partlycloudy', 'cloudy', 'rainy', 'rainy', 'cloudy', 'partlycloudy'];
  const base = Date.now();
  return conds.map((condition, i) => ({
    datetime: new Date(base + (i + 1) * 3600_000).toISOString(),
    condition,
    temperature: Math.round((27.4 - i * 0.8 + (i > 3 ? 1 : 0)) * 10) / 10,
  }));
}

function binHistory(id, start, end) {
  const rows = [];
  const span = end - start;
  if (id === 'binary_sensor.server_ok') {
    rows.push({ s: 'on', lu: start });
    rows.push({ s: 'off', lu: start + span * 0.42 });
    rows.push({ s: 'on', lu: start + span * 0.435 });
    rows.push({ s: 'off', lu: start + span * 0.81 });
    rows.push({ s: 'on', lu: start + span * 0.822 });
  } else {
    rows.push({ s: 'off', lu: start });
    for (const [a, b] of [[0.12, 0.135], [0.31, 0.325], [0.55, 0.61], [0.9, 0.915]]) {
      rows.push({ s: 'on', lu: start + span * a });
      rows.push({ s: 'off', lu: start + span * b });
    }
  }
  return rows;
}

function genHistory(id, start, end, step) {
  const rows = [];
  for (let t = start; t <= end; t += step) rows.push({ s: valueAt(id, t).toFixed(2), lu: t });
  return rows;
}

const bump = (id, patch, attrs) => {
  const s = states[id];
  states[id] = {
    ...s,
    ...(patch ? { state: patch } : {}),
    attributes: { ...s.attributes, ...attrs },
    last_updated: now(), last_changed: now(),
  };
};

const hassBase = {
  locale: { language: 'en' },
  entities: {},
  formatEntityState(st) {
    const map = { on: 'On', off: 'Off', open: 'Open', closed: 'Closed', locked: 'Locked', unlocked: 'Unlocked', playing: 'Playing', paused: 'Paused', heat: 'Heat', cool: 'Cool', heat_cool: 'Heat/Cool', auto: 'Auto', unavailable: 'Unavailable', home: 'Home', not_home: 'Away', cleaning: 'Cleaning', docked: 'Docked', returning: 'Returning', disarmed: 'Disarmed', armed_home: 'Armed home', armed_away: 'Armed away', armed_night: 'Armed night', active: 'Running', idle: 'Idle', partlycloudy: 'Partly cloudy', streaming: 'Live' };
    return map[st.state] ?? st.state;
  },
  async callService(domain, service, data = {}) {
    const id = data.entity_id;
    console.info('callService', domain, service, data);
    if (service === 'turn_on') {
      if (domain === 'light') bump(id, 'on', data.brightness_pct != null ? { brightness: Math.round(data.brightness_pct * 2.55) } : {});
      else if (domain === 'script') { bump(id, 'on'); setTimeout(() => { bump(id, 'off'); push(); }, 3000); }
      else if (domain !== 'scene') bump(id, 'on');
    } else if (service === 'turn_off') bump(id, 'off', domain === 'fan' ? { percentage: 0 } : {});
    else if (service === 'press') { /* stateless */ }
    else if (service === 'lock') bump(id, 'locked');
    else if (service === 'unlock') bump(id, 'unlocked');
    else if (service === 'open_cover') bump(id, 'open', { current_position: 100 });
    else if (service === 'close_cover') bump(id, 'closed', { current_position: 0 });
    else if (service === 'stop_cover') { /* noop */ }
    else if (service === 'set_cover_position') bump(id, data.position > 0 ? 'open' : 'closed', { current_position: data.position });
    else if (service === 'set_percentage') bump(id, data.percentage > 0 ? 'on' : 'off', { percentage: data.percentage });
    else if (service === 'set_preset_mode') bump(id, 'on', { preset_mode: data.preset_mode });
    else if (service === 'set_temperature') bump(id, null, data.temperature != null ? { temperature: data.temperature } : { target_temp_low: data.target_temp_low, target_temp_high: data.target_temp_high });
    else if (service === 'set_hvac_mode') bump(id, data.hvac_mode, { hvac_action: data.hvac_mode === 'off' ? undefined : 'idle' });
    else if (service === 'media_play_pause') bump(id, states[id].state === 'playing' ? 'paused' : 'playing');
    else if (service === 'media_next_track' || service === 'media_previous_track') bump(id, null, { media_title: service.includes('next') ? 'Next song' : 'Previous song' });
    else if (service === 'volume_set') bump(id, null, { volume_level: data.volume_level });
    else if (service === 'lock') bump(id, 'locked');
    else if (service === 'unlock') bump(id, 'unlocked');
    else if (service === 'alarm_disarm') bump(id, 'disarmed');
    else if (service === 'alarm_arm_home') bump(id, 'armed_home');
    else if (service === 'alarm_arm_away') bump(id, 'armed_away');
    else if (service === 'alarm_arm_night') bump(id, 'armed_night');
    else if (service === 'start') bump(id, domain === 'vacuum' ? 'cleaning' : 'active', domain === 'timer' ? { finishes_at: new Date(Date.now() + 4 * 60000).toISOString() } : {});
    else if (service === 'pause') bump(id, domain === 'vacuum' ? 'paused' : 'paused');
    else if (service === 'cancel') bump(id, 'idle', { finishes_at: undefined });
    else if (service === 'return_to_base') bump(id, 'returning');
    else if (service === 'locate') { /* beep */ }
    else if (service === 'set_fan_speed') bump(id, null, { fan_speed: data.fan_speed });
    else if (service === 'install') {
      bump(id, 'on', { in_progress: true });
      setTimeout(() => { bump(id, 'off', { in_progress: false, installed_version: states[id].attributes.latest_version }); push(); }, 4000);
    }
    else if (service === 'update_item') {
      const item = TODO_ITEMS.find((t) => t.uid === data.item || t.summary === data.item);
      if (item) item.status = data.status;
      bump(id, String(TODO_ITEMS.filter((t) => t.status === 'needs_action').length), {});
    }
    else if (service === 'set_value') bump(id, String(data.value));
    else if (service === 'select_option') bump(id, data.option);
    else if (service === 'set_humidity') bump(id, null, { humidity: data.humidity });
    else if (service === 'set_mode') bump(id, null, { mode: data.mode });
    else if (service === 'trigger') bump(id, null, { last_triggered: new Date().toISOString() });
    else if (service === 'select_source') bump(id, null, { source: data.source });
    else if (service === 'volume_up' || service === 'volume_down') {
      const v = states[id].attributes.volume_level ?? 0.3;
      bump(id, null, { volume_level: Math.min(1, Math.max(0, v + (service === 'volume_up' ? 0.05 : -0.05))) });
    }
    else if (service === 'volume_mute') bump(id, null, { is_volume_muted: data.is_volume_muted });
    else if (service === 'join') {
      const members = new Set(states[id].attributes.group_members ?? [id]);
      for (const m of data.group_members ?? []) members.add(m);
      bump(id, null, { group_members: [...members] });
    }
    else if (service === 'unjoin') {
      for (const master of Object.keys(states)) {
        const gm = states[master].attributes.group_members;
        if (Array.isArray(gm) && gm.includes(id)) bump(master, null, { group_members: gm.filter((m) => m !== id) });
      }
    }
    else if (service === 'dismiss') {
      NOTIFS = NOTIFS.filter((n) => n.notification_id !== data.notification_id);
    }
    push();
  },
  async callApi(method, path) {
    await new Promise((r) => setTimeout(r, 80));
    if (path.startsWith('calendars/')) {
      const day = 86400_000;
      const at = (d, h, m = 0) => new Date(new Date(Date.now() + d * day).setHours(h, m, 0, 0)).toISOString();
      return [
        { summary: 'Standup meeting', start: { dateTime: at(0, 10) }, end: { dateTime: at(0, 10, 30) } },
        { summary: 'Filament delivery', start: { date: new Date(Date.now() + day).toISOString().slice(0, 10) }, end: { date: new Date(Date.now() + 2 * day).toISOString().slice(0, 10) } },
        { summary: 'Dinner with family', start: { dateTime: at(1, 19) }, end: { dateTime: at(1, 21) } },
        { summary: 'Server maintenance window', start: { dateTime: at(3, 2) }, end: { dateTime: at(3, 4) } },
      ];
    }
    if (path.startsWith('tts/')) return {};
    if (path.startsWith('logbook/')) {
      const ago = (m) => new Date(Date.now() - m * 60000).toISOString();
      return [
        { when: ago(12), state: 'on', name: 'Espresso machine' },
        { when: ago(95), state: 'off', name: 'Espresso machine' },
        { when: ago(180), state: 'on', name: 'Espresso machine' },
        { when: ago(260), state: 'unavailable', name: 'Espresso machine' },
        { when: ago(270), state: 'on', name: 'Espresso machine' },
      ];
    }
    throw new Error('unmocked API: ' + path);
  },
  connection: {
    async subscribeMessage(cb, msg) {
      if (msg.type === 'weather/subscribe_forecast') {
        const rows = msg.forecast_type === 'daily' ? dailyForecast() : hourlyForecast();
        setTimeout(() => cb({ forecast: rows }), 150);
        return () => {};
      }
      throw new Error('unmocked subscription: ' + msg.type);
    },
  },
  async callWS(msg) {
    await new Promise((r) => setTimeout(r, 100));
    const start = Date.parse(msg.start_time) / 1000;
    const end = Date.parse(msg.end_time) / 1000;
    if (msg.type === 'history/history_during_period') {
      return Object.fromEntries(msg.entity_ids.map((id) => {
        if (SENSORS[id]) return [id, genHistory(id, start, end, Math.max((end - start) / 260, 30))];
        if (id.startsWith('binary_sensor.')) return [id, binHistory(id, start, end)];
        return [id, []];
      }));
    }
    if (msg.type === 'todo/item/list') {
      return { items: TODO_ITEMS.map((t) => ({ ...t })) };
    }
    if (msg.type === 'persistent_notification/get') {
      return NOTIFS.map((n) => ({ ...n }));
    }
    if (msg.type === 'conversation/process') {
      const text = String(msg.text ?? '');
      const reply = /light|불|lamp/i.test(text) ? 'Turned on 3 lights in the living room.'
        : /temp|온도|thermostat/i.test(text) ? 'The living room is 23.2 degrees.'
        : `Sorry, I don't know how to handle "${text}" yet.`;
      return { response: { speech: { plain: { speech: reply } } } };
    }
    if (msg.type === 'recorder/statistics_during_period') {
      const step = msg.period === 'day' ? 86400 : 3600;
      return Object.fromEntries(msg.statistic_ids.map((id) => {
        if (!SENSORS[id]) return [id, []];
        const rows = [];
        for (let t = start; t <= end; t += step) {
          const mean = valueAt(id, t + step / 2);
          rows.push({ start: t * 1000, mean, change: Math.abs(mean) / 40 });
        }
        return [id, rows];
      }));
    }
    throw new Error('unmocked: ' + msg.type);
  },
};

const cards = [];
const main = document.getElementById('main');
let count = 0;

for (const [title, slots] of SECTIONS) {
  const h = document.createElement('h2');
  const grid = document.createElement('div');
  grid.className = 'grid';
  let ok = 0;
  for (const [cls, config] of slots) {
    const tag = config.type.replace('custom:', '');
    if (!customElements.get(tag)) continue;
    const wrap = document.createElement('div');
    wrap.className = `slot ${cls}`;
    const card = document.createElement(tag);
    try { card.setConfig(config); } catch (e) { console.warn(tag, e); continue; }
    wrap.appendChild(card);
    grid.appendChild(wrap);
    cards.push(card);
    ok++; count++;
  }
  h.innerHTML = `<span>${title.split(' — ')[0]}</span> — ${title.split(' — ')[1] ?? ''} · ${ok}`;
  if (ok) { main.appendChild(h); main.appendChild(grid); }
}
console.info(`Silk demo: ${count} live cards`);

function push() {
  const hass = { ...hassBase, states: { ...states } };
  for (const card of cards) card.hass = hass;
}
push();
setInterval(() => {
  for (const id of Object.keys(SENSORS)) {
    bump(id, valueAt(id, Date.now() / 1000).toFixed(1), {});
  }
  push();
}, 5000);

document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const light = root.dataset.theme === 'light';
  root.dataset.theme = light ? '' : 'light';
  document.getElementById('theme').textContent = light ? 'Light mode' : 'Dark mode';
});
