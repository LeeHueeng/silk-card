<!doctype html>
<html>
<head><meta charset="utf-8"><title>merge check — bill · breakdown · chips · device</title></head>
<body>
<pre id="out">running</pre>
<script type="module">
import '../dist/silk-card.js';

const out = document.getElementById('out');
const log = (m) => { out.textContent += m + '\n'; };
let passed = 0, failed = 0;
const check = (label, ok, detail = '') => {
  log(`${ok ? 'PASS' : 'FAIL'} — ${label}${detail ? ` :: ${detail}` : ''}`);
  ok ? passed++ : failed++;
};

// ha-form 자리에 스키마·데이터만 보관하는 껍데기. value-changed 는 테스트가 직접 쏜다.
customElements.define('ha-form', class extends HTMLElement {
  set schema(v) { this._schema = v; }
  get schema() { return this._schema; }
  set data(v) { this._data = v; }
  get data() { return this._data; }
  set hass(v) {}
  set computeLabel(fn) { this._label = fn; }
  get computeLabel() { return this._label; }
});

const hass = {
  states: {},
  locale: { language: 'ko' },
  language: 'ko',
  callService: async () => {},
  callWS: async () => ({}),
};

function findForm(root, depth = 0) {
  if (!root || depth > 4) return null;
  const direct = root.querySelector?.('ha-form');
  if (direct) return direct;
  for (const el of root.querySelectorAll?.('*') ?? []) {
    if (el.shadowRoot) {
      const found = findForm(el.shadowRoot, depth + 1);
      if (found) return found;
    }
  }
  return null;
}

/** grid 하위 스키마까지 펼친다. */
function flatten(schema) {
  const out = [];
  for (const field of schema ?? []) {
    out.push(field);
    if (Array.isArray(field.schema)) out.push(...flatten(field.schema));
  }
  return out;
}

const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const GRID = { columns: 6, rows: 3 };
const VISIBILITY = [{ condition: 'state', entity: 'input_boolean.guest', state: 'on' }];

const CASES = [
  {
    label: 'bill',
    tag: 'silk-bill-card',
    field: 'devices',
    config: {
      type: 'custom:silk-bill-card',
      devices: [
        { entity: 'sensor.fridge', name: '냉장고', icon: 'mdi:fridge' },
        { entity: 'sensor.washer', name: '세탁기', icon: 'mdi:washing-machine' },
        { entity: 'sensor.tv', name: 'TV', icon: 'mdi:television' },
      ],
      period: 'month',
      tariff: 'kr-residential',
      currency: '원',
      unaccounted: 'sensor.house_total',
      vat: true,
      color: '#f0b357',
      grid_options: { ...GRID },
      visibility: VISIBILITY,
    },
    // 스키마에 없는 키들 — 라운드트립에서 살아남아야 한다.
    extraKeys: ['unaccounted', 'vat', 'color'],
    keep: ['sensor.tv', 'sensor.fridge'],
    add: 'sensor.dryer',
    drop: 'sensor.washer',
  },
  {
    label: 'breakdown',
    tag: 'silk-breakdown-card',
    field: 'devices',
    config: {
      type: 'custom:silk-breakdown-card',
      devices: [
        { entity: 'sensor.fridge_today', name: '냉장고', icon: 'mdi:fridge' },
        { entity: 'sensor.washer_today', name: '세탁기', icon: 'mdi:washing-machine' },
        { entity: 'sensor.tv_today', name: 'TV', icon: 'mdi:television' },
      ],
      unaccounted: 'sensor.house_today',
      color: '#7ec9a2',
      grid_options: { ...GRID },
      visibility: VISIBILITY,
    },
    extraKeys: ['color'],
    keep: ['sensor.tv_today', 'sensor.fridge_today'],
    add: 'sensor.dryer_today',
    drop: 'sensor.washer_today',
  },
  {
    label: 'chips',
    tag: 'silk-chips-card',
    field: 'chips',
    config: {
      type: 'custom:silk-chips-card',
      chips: [
        { entity: 'sensor.porch', name: '현관', icon: 'mdi:door', color: '#f0b357' },
        { entity: 'binary_sensor.rain', name: '비', icon: 'mdi:weather-rainy' },
        { entity: 'sensor.co2', name: 'CO2', icon: 'mdi:molecule-co2' },
      ],
      alignment: 'center',
      grid_options: { ...GRID },
      visibility: VISIBILITY,
    },
    extraKeys: [],
    keep: ['sensor.co2', 'sensor.porch'],
    add: 'sensor.humidity',
    drop: 'binary_sensor.rain',
  },
  {
    label: 'device',
    tag: 'silk-device-card',
    field: 'devices',
    config: {
      type: 'custom:silk-device-card',
      name: 'Zigbee fleet',
      devices: [
        { entity: 'sensor.door_battery', name: '현관 센서', icon: 'mdi:door' },
        { entity: 'sensor.motion_battery', name: '모션 센서', icon: 'mdi:motion-sensor' },
        { entity: 'sensor.button_battery', name: '벽 버튼', icon: 'mdi:gesture-tap-button' },
      ],
      grid_options: { ...GRID },
      visibility: VISIBILITY,
    },
    extraKeys: [],
    keep: ['sensor.button_battery', 'sensor.door_battery'],
    add: 'sensor.leak_battery',
    drop: 'sensor.motion_battery',
  },
];

out.textContent = '';

for (const c of CASES) {
  log(`\n### ${c.label} (${c.tag})`);
  const Card = customElements.get(c.tag);
  if (!Card || typeof Card.getConfigElement !== 'function') {
    check(`${c.label}: 편집기 존재`, false, '요소 또는 getConfigElement 없음');
    continue;
  }

  const editor = await Card.getConfigElement();
  document.body.appendChild(editor);
  editor.setConfig(structuredClone(c.config));
  editor.hass = hass;
  await sleep(50);

  const form = findForm(editor.shadowRoot ?? editor);
  if (!form) {
    check(`${c.label} (a) 상세 설정에서도 피커 노출`, false, 'ha-form 렌더 안 됨');
    continue;
  }

  // (a) 이름·아이콘이 붙은 설정에서도 엔티티 피커가 스키마에 남아 있는가
  const fields = flatten(form.schema);
  const picker = fields.find((f) => f.name === c.field);
  const isMulti = !!picker?.selector?.entity?.multiple;
  const fed = form.data?.[c.field];
  const fedIds = Array.isArray(fed) && fed.every((v) => typeof v === 'string');
  check(
    `${c.label} (a) 상세 설정에서도 '${c.field}' 엔티티 피커가 스키마에 있음`,
    isMulti && fedIds,
    `picker=${!!picker} multiple=${isMulti} data=${JSON.stringify(fed)}`
  );

  // (b) 피커에서 순서 변경 + 1개 제거 + 1개 추가 → 살아남은 항목의 name/icon 유지
  const nextIds = [...c.keep, c.add];
  let emitted = null;
  editor.addEventListener('config-changed', (ev) => { emitted = ev.detail.config; }, { once: true });
  form.dispatchEvent(
    new CustomEvent('value-changed', {
      detail: { value: { ...form.data, [c.field]: nextIds } },
    })
  );
  await sleep(0);

  if (!emitted) {
    check(`${c.label} (b) 병합 결과`, false, 'config-changed 이벤트 없음');
    continue;
  }

  const before = c.config[c.field];
  const list = emitted[c.field];
  const idOf = (item) => (typeof item === 'string' ? item : item?.entity);
  const orderOk = Array.isArray(list) && eq(list.map(idOf), nextIds);
  const keptOk = c.keep.every((id) => {
    const was = before.find((item) => item.entity === id);
    const now = list?.find((item) => idOf(item) === id);
    return now && typeof now === 'object' && eq(now, was);
  });
  const addedBare = list?.[list.length - 1] === c.add;
  const droppedOk = !list?.some((item) => idOf(item) === c.drop);
  check(
    `${c.label} (b) 살아남은 항목은 name·icon 유지, 새 항목은 문자열, 제거는 반영`,
    orderOk && keptOk && addedBare && droppedOk,
    `order=${orderOk} kept=${keptOk} added=${addedBare} dropped=${droppedOk} :: ${JSON.stringify(list)}`
  );

  // (c) 스키마가 모르는 키들이 그대로 살아남았는가
  const typeOk = emitted.type === c.config.type;
  const gridOk = eq(emitted.grid_options, c.config.grid_options);
  const visOk = eq(emitted.visibility, c.config.visibility);
  const extraOk = c.extraKeys.every((key) => eq(emitted[key], c.config[key]));
  check(
    `${c.label} (c) type·grid_options·visibility${c.extraKeys.length ? '·' + c.extraKeys.join('·') : ''} 유지`,
    typeOk && gridOk && visOk && extraOk,
    `type=${typeOk} grid=${gridOk} visibility=${visOk} extra=${extraOk}`
  );

  // (d) 렌더 경로는 그대로: 두 설정 모양 모두 예외 없이 그려진다
  let renderOk = true;
  let renderErr = '';
  try {
    for (const shape of [c.config, { ...c.config, [c.field]: before.map((i) => i.entity) }]) {
      const card = document.createElement(c.tag);
      card.setConfig(structuredClone(shape));
      card.hass = hass;
      document.body.appendChild(card);
      await sleep(0);
      if (!card.shadowRoot?.querySelector('ha-card')) { renderOk = false; renderErr = 'ha-card 없음'; }
      card.remove();
    }
  } catch (err) {
    renderOk = false;
    renderErr = err.message;
  }
  check(`${c.label} (d) 객체·아이디 두 설정 모양 모두 렌더`, renderOk, renderErr);

  editor.remove();
}

// 참고: device 카드의 {name, battery, signal, last_seen} 행은 entity 키가 없어
// 피커가 표현할 수 없다. 스칼라만 수정했을 때 그 목록이 어떻게 되는지 기록만 남긴다.
{
  const editor = await customElements.get('silk-device-card').getConfigElement();
  document.body.appendChild(editor);
  const full = {
    type: 'custom:silk-device-card',
    name: 'Zigbee fleet',
    devices: [
      { name: 'Door sensor', battery: 'sensor.door_battery', signal: 'sensor.door_lqi', last_seen: 'sensor.door_last_seen' },
      { name: 'Wall button', battery: 'sensor.button_battery' },
    ],
  };
  editor.setConfig(structuredClone(full));
  editor.hass = hass;
  await sleep(50);
  const form = findForm(editor.shadowRoot ?? editor);
  let emitted = null;
  editor.addEventListener('config-changed', (ev) => { emitted = ev.detail.config; }, { once: true });
  form.dispatchEvent(new CustomEvent('value-changed', { detail: { value: { ...form.data, name: 'Fleet' } } }));
  await sleep(0);
  log(`\nNOTE — device 전체행({name,battery,...}) 설정에서 이름만 수정 시 devices = ${JSON.stringify(emitted?.devices)}`);
  editor.remove();
}

log(`\n총계: ${passed} PASS / ${failed} FAIL`);
log(failed === 0 ? 'ALL PASS' : 'SOME FAILED');
</script>
</body>
</html>
