<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silk-card demo</title>
<style>
  :root {
    --primary-color: #4aa8ff;
    --rgb-primary-color: 74, 168, 255;
    --primary-text-color: #e1e5ea;
    --rgb-primary-text-color: 225, 229, 234;
    --secondary-text-color: #9aa4b2;
    --card-background-color: #1c1f26;
    --error-color: #ef6c6c;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: #12141a;
    color: var(--primary-text-color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p { color: var(--secondary-text-color); font-size: 13px; margin: 0 0 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 420px));
    gap: 16px;
    width: 100%;
    max-width: 880px;
    justify-content: center;
  }
  .slot { height: 200px; }
  .slot.tall { height: 240px; }
</style>
</head>
<body>
<h1>silk-card</h1>
<p>Mock data — press and drag on a graph to scrub, tap the range chips to morph.</p>
<div class="grid" id="grid"></div>

<script type="module">
import '../dist/silk-card.js';

// Minimal stand-in for Home Assistant's ha-card element.
if (!customElements.get('ha-card')) {
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      this.style.cssText =
        'display:flex;flex-direction:column;height:100%;background:var(--card-background-color);' +
        'border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.35);overflow:hidden;box-sizing:border-box;';
    }
  });
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SENSORS = {
  'sensor.living_room_temperature': { base: 22, amp: 3, noise: 0.12, unit: '°C', name: 'Living room', device_class: 'temperature', seed: 11, gap: true },
  'sensor.bedroom_temperature': { base: 20, amp: 2, noise: 0.1, unit: '°C', name: 'Bedroom', device_class: 'temperature', seed: 22 },
  'sensor.house_power': { base: 640, amp: 320, noise: 60, unit: 'W', name: 'House power', device_class: 'power', seed: 33, spiky: true },
  'sensor.bathroom_humidity': { base: 55, amp: 14, noise: 0.9, unit: '%', name: 'Bathroom humidity', device_class: 'humidity', seed: 44 },
};

function valueAt(id, t) {
  const s = SENSORS[id];
  const rng = mulberry32(s.seed + Math.floor(t / 1200));
  const day = Math.sin(((t % 86400) / 86400) * Math.PI * 2 - Math.PI / 2);
  const slow = Math.sin(t / 41000 + s.seed) * s.amp * 0.35;
  let v = s.base + day * s.amp + slow + (rng() - 0.5) * 2 * s.noise;
  if (s.spiky && rng() > 0.86) v += s.amp * (0.8 + rng());
  return v;
}

function genHistory(id, start, end, step) {
  const s = SENSORS[id];
  const rows = [];
  for (let t = start; t <= end; t += step) {
    const inGap = s.gap && t > end - (end - start) * 0.42 && t < end - (end - start) * 0.34;
    rows.push({ s: inGap ? 'unavailable' : valueAt(id, t).toFixed(2), lu: t });
  }
  return rows;
}

const hassBase = {
  locale: { language: 'en' },
  entities: {},
  async callWS(msg) {
    const start = Date.parse(msg.start_time) / 1000;
    const end = Date.parse(msg.end_time) / 1000;
    await new Promise((r) => setTimeout(r, 120)); // simulate latency
    if (msg.type === 'history/history_during_period') {
      const out = {};
      for (const id of msg.entity_ids) out[id] = genHistory(id, start, end, Math.max((end - start) / 260, 30));
      return out;
    }
    if (msg.type === 'recorder/statistics_during_period') {
      const out = {};
      for (const id of msg.statistic_ids) {
        out[id] = [];
        for (let t = start; t <= end; t += 3600) out[id].push({ start: t * 1000, mean: valueAt(id, t) });
      }
      return out;
    }
    throw new Error(`unmocked WS call: ${msg.type}`);
  },
};

function buildStates() {
  const now = Date.now();
  const states = {};
  for (const [id, s] of Object.entries(SENSORS)) {
    states[id] = {
      entity_id: id,
      state: valueAt(id, now / 1000).toFixed(2),
      attributes: { unit_of_measurement: s.unit, friendly_name: s.name, device_class: s.device_class },
      last_changed: new Date(now).toISOString(),
      last_updated: new Date(now).toISOString(),
    };
  }
  return states;
}

const CARDS = [
  { slot: '', config: { type: 'custom:silk-card', entity: 'sensor.living_room_temperature' } },
  {
    slot: 'tall',
    config: {
      type: 'custom:silk-card',
      name: 'Climate',
      entities: [
        { entity: 'sensor.living_room_temperature', name: 'Living room' },
        { entity: 'sensor.bedroom_temperature', name: 'Bedroom', color: '#f0b357' },
      ],
    },
  },
  { slot: '', config: { type: 'custom:silk-card', entity: 'sensor.house_power', color: '#5ec78d', extremes: false } },
  { slot: '', config: { type: 'custom:silk-card', entity: 'sensor.bathroom_humidity', y_min: 0, y_max: 100, ranges: ['1h', '1d', '3d'] } },
];

await customElements.whenDefined('silk-card');
const grid = document.getElementById('grid');
const cards = CARDS.map(({ slot, config }) => {
  const wrap = document.createElement('div');
  wrap.className = `slot ${slot}`;
  const card = document.createElement('silk-card');
  card.setConfig(config);
  wrap.appendChild(card);
  grid.appendChild(wrap);
  return card;
});

function push() {
  const hass = { ...hassBase, states: buildStates() };
  for (const card of cards) card.hass = hass;
}
push();
setInterval(push, 5000);
</script>
</body>
</html>
